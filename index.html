<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "PASTE_YOUR_URL_HERE";
const SUPA_KEY = "PASTE_YOUR_ANON_KEY_HERE";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

async function registerStudent(){
  let name=document.getElementById('sName').value;
  let phone=document.getElementById('sPhone').value;
  let course=document.getElementById('sCourse').value;
  if(name==''||phone==''){alert('Jaza Jina na Namba');return}
  
  let { error } = await supa.from('mda_students').insert([{name:name, phone:phone, course:course, date:new Date().toLocaleString(), status:'Pending'}]);
  
  if(error){alert('Error: '+error.message); return;}
  
  document.getElementById('regMsg').innerText='✅ Asante '+name+'! Umeregister. Data saved ONLINE!';
  document.getElementById('sName').value='';document.getElementById('sPhone').value='';
  window.open('https://wa.me/254718899014?text=New%20MDA%20Registration:%20'+encodeURIComponent(name+' - '+phone+' - '+course),'_blank');
}
</script>
